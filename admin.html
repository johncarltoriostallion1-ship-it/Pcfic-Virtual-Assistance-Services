<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | PCFIC</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1F44;--blue:#1652F0;--sky:#EAF1FF;--sky2:#F5F8FF;--line:#DCE5F7;--muted:#5B6B88;--red:#D92D20}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--sky2);color:var(--navy);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 30px 60px -40px rgba(10,31,68,.5)}
.login img{width:56px;height:56px;border-radius:50%;display:block;margin:0 auto 14px}
.login h1{text-align:center;font-size:1.3rem;margin-bottom:4px}
.login p.sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:24px}
label{display:block;font-size:.76rem;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:10px;font-weight:700;font-size:.82rem;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{opacity:.88}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #F5C2BE}
.btn.sm{padding:6px 10px;font-size:.75rem;border-radius:8px}
.btn.block{width:100%;margin-top:22px}
.err{color:var(--red);font-size:.82rem;margin-top:12px;min-height:1em}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:960px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;border-radius:50%}
.top b{margin-right:auto}
.top a{color:var(--blue);font-weight:600;font-size:.82rem;text-decoration:none}
.nav{max-width:960px;margin:20px auto 0;padding:0 20px;display:flex;gap:8px}
.nav button{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.82rem;cursor:pointer}
.nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:960px;margin:auto;padding:18px 20px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{font-size:1.05rem;margin-right:auto}
.hint{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
/* client list */
.cl{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--sky2)}
.cl .lg{width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-weight:800;font-size:.7rem;text-align:center}
.cl .lg img{width:100%;height:100%;object-fit:contain}
.cl .nm{flex:1;min-width:0}
.cl .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .nm small{color:var(--muted);font-size:.76rem}
.pill{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sky);color:var(--blue)}
.pill.off{background:#F1F3F7;color:var(--muted)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* editor */
.ed-logo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ed-logo .lg{width:84px;height:84px;border-radius:16px;border:1px solid var(--line);background:var(--sky2);display:grid;place-items:center;overflow:hidden;font-size:.7rem;color:var(--muted);text-align:center}
.ed-logo .lg img{width:100%;height:100%;object-fit:contain}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:10px}
.im{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sky2)}
.im img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}
.im .bar{padding:6px;justify-content:space-between}
.im .btn.sm{padding:4px 7px}
.check{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:.85rem;font-weight:600}
.check label{margin:0}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin:22px -22px -22px;padding:14px 22px;border-radius:0 0 16px 16px;display:flex;gap:10px}
.foot .sp{flex:1}
.svc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--sky2)}
.svc .row{display:grid;grid-template-columns:1fr 150px 130px;gap:10px}
.svc label{margin-top:0}
.svc .bar{margin-top:10px}.svc .bar .sp{flex:1}
.svc.dirty{border-color:var(--blue)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.75rem;cursor:pointer}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.empty{color:var(--muted);font-size:.85rem;padding:12px 0}
.busy{position:fixed;inset:0;background:rgba(245,248,255,.6);display:grid;place-items:center;z-index:20;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:.85rem;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}
@media(max-width:640px){.grid2,.svc .row{grid-template-columns:1fr}.cl{flex-wrap:wrap}}
</style>
</head>
<body>

<section class="login" id="login">
  <form id="login-form">
    <img src="assets/img/logo-pcfic-sm.png" alt="">
    <h1>PCFIC Admin</h1>
    <p class="sub">Sign in to edit the website</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn block" type="submit">Sign in</button>
    <p class="err" id="login-err"></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top"><div class="in">
    <img src="assets/img/logo-pcfic-sm.png" alt="">
    <b>PCFIC Admin</b>
    <a href="index.html" target="_blank">View site ↗</a>
    <button class="btn ghost sm" id="logout">Sign out</button>
  </div></header>

  <nav class="nav" id="nav">
    <button class="on" data-view="clients">Clients</button>
    <button data-view="contact">Contact</button>
    <button data-view="services">Services</button>
  </nav>

  <main>
    <!-- CLIENT LIST -->
    <section class="card" id="v-clients">
      <div class="head"><h2>Clients</h2><button class="btn" id="cl-add">+ Add client</button></div>
      <p class="hint" style="margin:-8px 0 14px">Order here = order on the website. Use ↑ ↓ to move.</p>
      <div id="cl-list"></div>
    </section>

    <!-- CLIENT EDITOR -->
    <section class="card hidden" id="v-edit">
      <div class="head"><button class="btn ghost sm" id="ed-back">← Back</button><h2 id="ed-title">Edit client</h2></div>

      <label>Logo</label>
      <div class="ed-logo">
        <div class="lg" id="ed-logo"></div>
        <div class="bar">
          <button class="btn ghost sm" id="ed-logo-pick">Replace logo</button>
          <button class="btn danger sm" id="ed-logo-del">Remove</button>
          <input type="file" id="ed-logo-file" accept="image/*" class="hidden">
        </div>
      </div>

      <div class="grid2">
        <div><label for="ed-name">Business name *</label><input id="ed-name"></div>
        <div><label for="ed-short">Short name (under the logo)</label><input id="ed-short"></div>
        <div><label for="ed-industry">Industry</label><input id="ed-industry" placeholder="e.g. Healthcare"></div>
        <div><label for="ed-location">Location</label><input id="ed-location" placeholder="e.g. Dededo, Guam"></div>
      </div>
      <label for="ed-website">Website</label><input id="ed-website" placeholder="https://...">
      <label for="ed-about">About the client</label><textarea id="ed-about"></textarea>
      <label for="ed-services">What we did for them (comma separated)</label><input id="ed-services" placeholder="Social media content, Graphic design">
      <div class="check"><input type="checkbox" id="ed-show"><label for="ed-show">Show on the Clients page (with logo)</label></div>

      <div class="head" style="margin:24px 0 0"><h2 style="font-size:.95rem">Work images <span class="hint" id="ed-count"></span></h2>
        <button class="btn ghost sm" id="ed-img-add">+ Add images</button>
        <input type="file" id="ed-img-file" accept="image/*" multiple class="hidden">
        <input type="file" id="ed-img-replace" accept="image/*" class="hidden">
      </div>
      <div class="imgs" id="ed-imgs"></div>

      <div class="foot">
        <button class="btn danger" id="ed-delete">Delete client</button>
        <span class="sp"></span>
        <button class="btn ghost" id="ed-cancel">Cancel</button>
        <button class="btn" id="ed-save">Save client</button>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="card hidden" id="v-contact">
      <div class="head"><h2>Contact details</h2></div>
      <p class="hint" style="margin-top:-8px">Shown on every page: WhatsApp buttons, footer and contact page.</p>
      <div class="grid2">
        <div><label for="s-whatsapp_number">WhatsApp number (digits only, with country code)</label><input id="s-whatsapp_number" data-key="whatsapp_number" placeholder="16717888712"></div>
        <div><label for="s-whatsapp_display">WhatsApp number as shown</label><input id="s-whatsapp_display" data-key="whatsapp_display" placeholder="+1 (671) 788-8712"></div>
        <div><label for="s-email">Email</label><input id="s-email" data-key="email" type="email"></div>
        <div><label for="s-facebook_url">Facebook page link (empty = hide icon)</label><input id="s-facebook_url" data-key="facebook_url" placeholder="https://facebook.com/..."></div>
      </div>
      <div class="foot"><span class="sp"></span><button class="btn" id="settings-save">Save contact details</button></div>
    </section>

    <!-- SERVICES -->
    <section class="card hidden" id="v-services">
      <div class="head"><h2>Services</h2><button class="btn" id="svc-add">+ Add service</button></div>
      <div class="tabs" id="svc-tabs">
        <button class="tab on" data-cat="all">All</button>
        <button class="tab" data-cat="accounting">Accounting</button>
        <button class="tab" data-cat="social">Social Media</button>
      </div>
      <div id="svc-list"></div>
    </section>
  </main>
</div>

<div class="busy hidden" id="busy">Uploading…</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/cms-config.js?v=2"></script>
<script>
(function () {
  var cfg = window.PCFIC_CMS || {};
  var $ = function (s) { return document.querySelector(s); };
  var toastT;
  function toast(msg, bad) {
    var t = $("#toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = "toast" + (bad ? " bad" : ""); }, 2800);
  }
  function busy(on, text) { $("#busy").textContent = text || "Uploading…"; $("#busy").classList.toggle("hidden", !on); }
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
  if (!cfg.url || !cfg.key || cfg.key.indexOf("PASTE_") === 0) {
    $("#login-err").textContent = "Admin is not connected yet: add the Supabase key in assets/js/cms-config.js.";
    $("#login-form button").disabled = true; return;
  }
  var sb = window.supabase.createClient(cfg.url, cfg.key);

  // ================= AUTH =================
  async function enter() {
    var r = await sb.rpc("is_admin");
    if (r.error || r.data !== true) {
      await sb.auth.signOut();
      $("#login-err").textContent = "This account is not allowed to edit the website.";
      return;
    }
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
    loadClients(); loadSettings(); loadServices();
  }
  $("#login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = this.querySelector("button"); btn.disabled = true; $("#login-err").textContent = "";
    var r = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
    btn.disabled = false;
    if (r.error) { $("#login-err").textContent = "Wrong email or password."; return; }
    $("#password").value = ""; enter();
  });
  $("#logout").addEventListener("click", async function () { await sb.auth.signOut(); location.reload(); });
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) enter(); });

  // ================= VIEWS =================
  function view(name) {
    ["clients", "edit", "contact", "services"].forEach(function (v) { $("#v-" + v).classList.toggle("hidden", v !== name); });
    var tab = name === "edit" ? "clients" : name;
    document.querySelectorAll("#nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.view === tab); });
    window.scrollTo(0, 0);
  }
  $("#nav").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (!$("#v-edit").classList.contains("hidden") && dirty && !confirm("Leave without saving this client?")) return;
    view(b.dataset.view);
  });

  // ================= UPLOAD =================
  function slugify(t) { return (t || "").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, 50) || "client"; }
  async function upload(file, folder) {
    if (!/^image\//.test(file.type)) throw new Error(file.name + " is not an image");
    if (file.size > 5 * 1024 * 1024) throw new Error(file.name + " is larger than 5 MB");
    var ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
    var path = folder + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "." + ext;
    var r = await sb.storage.from("site").upload(path, file, { contentType: file.type, cacheControl: "31536000" });
    if (r.error) throw new Error(r.error.message);
    return sb.storage.from("site").getPublicUrl(path).data.publicUrl;
  }
  function preview(u) { return u ? '<img src="' + esc(u) + '" alt="">' : ""; }

  // ================= CLIENTS =================
  var clients = [], cur = null, dirty = false;

  async function loadClients() {
    var r = await sb.from("clients").select("*").order("sort_order").order("created_at");
    if (r.error) return toast("Could not load clients: " + r.error.message, true);
    clients = r.data; renderList();
  }

  function renderList() {
    $("#cl-list").innerHTML = clients.length ? clients.map(function (c, i) {
      var n = (c.images || []).length;
      return '<div class="cl" data-id="' + c.id + '">' +
        '<div class="lg">' + (c.logo_url ? preview(c.logo_url) : esc(c.short_name || c.name).slice(0, 12)) + "</div>" +
        '<div class="nm"><b>' + esc(c.name) + "</b><small>" + n + " image" + (n === 1 ? "" : "s") + (c.industry ? " · " + esc(c.industry) : "") + "</small></div>" +
        '<span class="pill' + (c.show_on_clients ? "" : " off") + '">' + (c.show_on_clients ? "On Clients page" : "Portfolio only") + "</span>" +
        '<div class="bar">' +
          '<button class="btn ghost sm" data-act="up"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
          '<button class="btn ghost sm" data-act="down"' + (i === clients.length - 1 ? " disabled" : "") + ">↓</button>" +
          '<button class="btn sm" data-act="edit">Edit</button>' +
        "</div></div>";
    }).join("") : '<p class="empty">No clients yet. Click “Add client”.</p>';
  }

  $("#cl-list").addEventListener("click", async function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = b.closest(".cl").dataset.id, i = clients.findIndex(function (c) { return c.id === id; });
    if (b.dataset.act === "edit") return openEditor(clients[i]);
    var j = b.dataset.act === "up" ? i - 1 : i + 1, a = clients[i], o = clients[j];
    if (!o) return;
    var sa = a.sort_order, so = o.sort_order; if (sa === so) so = sa + (j < i ? -1 : 1);
    var r1 = await sb.from("clients").update({ sort_order: so }).eq("id", a.id);
    var r2 = await sb.from("clients").update({ sort_order: sa }).eq("id", o.id);
    if (r1.error || r2.error) return toast("Could not reorder", true);
    a.sort_order = so; o.sort_order = sa; clients[i] = o; clients[j] = a; renderList();
  });

  $("#cl-add").addEventListener("click", function () {
    openEditor({ id: null, slug: "", name: "", short_name: "", industry: "", location: "", about: "", website: "",
                 services: [], logo_url: "", images: [], show_on_clients: true });
  });

  function openEditor(c) {
    cur = JSON.parse(JSON.stringify(c)); cur.images = cur.images || []; dirty = false;
    $("#ed-title").textContent = c.id ? "Edit client" : "New client";
    $("#ed-name").value = cur.name; $("#ed-short").value = cur.short_name; $("#ed-industry").value = cur.industry;
    $("#ed-location").value = cur.location; $("#ed-website").value = cur.website; $("#ed-about").value = cur.about;
    $("#ed-services").value = (cur.services || []).join(", "); $("#ed-show").checked = !!cur.show_on_clients;
    $("#ed-delete").classList.toggle("hidden", !c.id);
    drawLogo(); drawImages(); view("edit");
  }
  $("#v-edit").addEventListener("input", function () { dirty = true; });

  function drawLogo() { $("#ed-logo").innerHTML = cur.logo_url ? preview(cur.logo_url) : "No logo"; }
  function drawImages() {
    $("#ed-count").textContent = "(" + cur.images.length + ")";
    $("#ed-imgs").innerHTML = cur.images.length ? cur.images.map(function (u, i) {
      return '<div class="im" data-i="' + i + '">' + preview(u) + '<div class="bar">' +
        '<button class="btn ghost sm" data-im="left"' + (i === 0 ? " disabled" : "") + ' title="Move left">←</button>' +
        '<button class="btn ghost sm" data-im="replace" title="Replace">Replace</button>' +
        '<button class="btn danger sm" data-im="del" title="Delete">✕</button>' +
        '<button class="btn ghost sm" data-im="right"' + (i === cur.images.length - 1 ? " disabled" : "") + ' title="Move right">→</button>' +
        "</div></div>";
    }).join("") : '<p class="empty">No images yet. The client page will say “Work samples coming soon”.</p>';
  }

  function folder() { return "clients/" + (cur.slug || slugify($("#ed-name").value)); }

  $("#ed-logo-pick").addEventListener("click", function () { $("#ed-logo-file").click(); });
  $("#ed-logo-file").addEventListener("change", async function () {
    var f = this.files[0]; this.value = ""; if (!f) return;
    busy(true);
    try { cur.logo_url = await upload(f, folder()); dirty = true; drawLogo(); toast("Logo ready: click Save client"); }
    catch (err) { toast("Upload failed: " + err.message, true); }
    busy(false);
  });
  $("#ed-logo-del").addEventListener("click", function () { cur.logo_url = ""; dirty = true; drawLogo(); });

  $("#ed-img-add").addEventListener("click", function () { $("#ed-img-file").click(); });
  $("#ed-img-file").addEventListener("change", async function () {
    var files = Array.prototype.slice.call(this.files); this.value = ""; if (!files.length) return;
    var ok = 0;
    for (var k = 0; k < files.length; k++) {
      busy(true, "Uploading " + (k + 1) + " of " + files.length + "…");
      try { cur.images.push(await upload(files[k], folder())); ok++; } catch (err) { toast(err.message, true); }
    }
    busy(false); dirty = true; drawImages();
    if (ok) toast(ok + " image" + (ok === 1 ? "" : "s") + " added: click Save client");
  });

  var replaceAt = -1;
  $("#ed-imgs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-im]"); if (!b) return;
    var i = +b.closest(".im").dataset.i, act = b.dataset.im, im = cur.images;
    if (act === "del") { if (!confirm("Remove this image?")) return; im.splice(i, 1); }
    if (act === "left" && i > 0) { var t = im[i - 1]; im[i - 1] = im[i]; im[i] = t; }
    if (act === "right" && i < im.length - 1) { var t2 = im[i + 1]; im[i + 1] = im[i]; im[i] = t2; }
    if (act === "replace") { replaceAt = i; return $("#ed-img-replace").click(); }
    dirty = true; drawImages();
  });
  $("#ed-img-replace").addEventListener("change", async function () {
    var f = this.files[0]; this.value = ""; if (!f || replaceAt < 0) return;
    busy(true);
    try { cur.images[replaceAt] = await upload(f, folder()); dirty = true; drawImages(); toast("Image replaced: click Save client"); }
    catch (err) { toast("Upload failed: " + err.message, true); }
    busy(false); replaceAt = -1;
  });

  function leaveEditor() { dirty = false; view("clients"); }
  $("#ed-back").addEventListener("click", function () { if (dirty && !confirm("Leave without saving?")) return; leaveEditor(); });
  $("#ed-cancel").addEventListener("click", function () { if (dirty && !confirm("Discard your changes?")) return; leaveEditor(); });

  $("#ed-save").addEventListener("click", async function () {
    var name = $("#ed-name").value.trim();
    if (!name) return toast("Business name is required", true);
    var web = $("#ed-website").value.trim();
    if (web && !/^https?:\/\//i.test(web)) web = "https://" + web;
    var row = {
      name: name, short_name: $("#ed-short").value.trim(), industry: $("#ed-industry").value.trim(),
      location: $("#ed-location").value.trim(), website: web, about: $("#ed-about").value.trim(),
      services: $("#ed-services").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      show_on_clients: $("#ed-show").checked, logo_url: cur.logo_url, images: cur.images
    };
    this.disabled = true;
    var r;
    if (cur.id) r = await sb.from("clients").update(row).eq("id", cur.id).select().single();
    else {
      var base = slugify(name), slug = base, n = 2;
      while (clients.some(function (c) { return c.slug === slug; })) slug = base + "-" + n++;
      row.slug = slug;
      row.sort_order = clients.reduce(function (m, c) { return Math.max(m, c.sort_order); }, 0) + 10;
      r = await sb.from("clients").insert(row).select().single();
    }
    this.disabled = false;
    if (r.error) return toast("Save failed: " + r.error.message, true);
    var idx = clients.findIndex(function (c) { return c.id === r.data.id; });
    if (idx >= 0) clients[idx] = r.data; else clients.push(r.data);
    renderList(); toast("Client saved"); leaveEditor();
  });

  $("#ed-delete").addEventListener("click", async function () {
    if (!confirm("Delete “" + cur.name + "” and remove it from the website? This cannot be undone.")) return;
    var r = await sb.from("clients").delete().eq("id", cur.id);
    if (r.error) return toast("Delete failed: " + r.error.message, true);
    clients = clients.filter(function (c) { return c.id !== cur.id; });
    renderList(); toast("Client deleted"); leaveEditor();
  });

  // ================= CONTACT =================
  async function loadSettings() {
    var r = await sb.from("settings").select("key,value");
    if (r.error) return toast("Could not load contact details", true);
    var S = {}; r.data.forEach(function (x) { S[x.key] = x.value; });
    document.querySelectorAll("[data-key]").forEach(function (el) { el.value = S[el.dataset.key] || ""; });
  }
  $("#settings-save").addEventListener("click", async function () {
    var wa = $("#s-whatsapp_number"); wa.value = wa.value.replace(/\D/g, "");
    var fb = $("#s-facebook_url"); if (fb.value.trim() && !/^https?:\/\//i.test(fb.value.trim())) fb.value = "https://" + fb.value.trim();
    var rows = Array.prototype.map.call(document.querySelectorAll("[data-key]"), function (el) {
      return { key: el.dataset.key, value: el.value.trim(), updated_at: new Date().toISOString() };
    });
    this.disabled = true;
    var r = await sb.from("settings").upsert(rows);
    this.disabled = false;
    toast(r.error ? "Save failed: " + r.error.message : "Contact details saved", !!r.error);
  });

  // ================= SERVICES =================
  var ICONS = { book: "Book", users: "People", chart: "Chart", file: "Document", card: "Card", calc: "Calculator",
                cal: "Calendar", pen: "Pen", social: "Social", target: "Target", video: "Video", web: "Website" };
  var CATS = { accounting: "Accounting", social: "Social Media" };
  var services = [], filter = "all";
  function opts(map, sel) { return Object.keys(map).map(function (k) { return '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + map[k] + "</option>"; }).join(""); }

  async function loadServices() {
    var r = await sb.from("services").select("*").order("sort_order").order("created_at");
    if (r.error) return toast("Could not load services", true);
    services = r.data; renderServices();
  }
  function visibleSvc() { return services.filter(function (s) { return filter === "all" || s.category === filter; }); }
  function renderServices() {
    var list = visibleSvc();
    $("#svc-list").innerHTML = list.length ? list.map(function (s, i) {
      return '<div class="svc" data-id="' + s.id + '"><div class="row">' +
          '<div><label>Title</label><input data-f="title" value="' + esc(s.title) + '"></div>' +
          '<div><label>Category</label><select data-f="category">' + opts(CATS, s.category) + "</select></div>" +
          '<div><label>Icon</label><select data-f="icon">' + opts(ICONS, s.icon) + "</select></div></div>" +
        '<label style="margin-top:10px">Description</label><textarea data-f="description">' + esc(s.description) + "</textarea>" +
        '<div class="bar"><button class="btn ghost sm" data-act="up"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
          '<button class="btn ghost sm" data-act="down"' + (i === list.length - 1 ? " disabled" : "") + ">↓</button>" +
          '<span class="sp"></span><button class="btn danger sm" data-act="del">Delete</button>' +
          '<button class="btn sm" data-act="save">Save</button></div></div>';
    }).join("") : '<p class="empty">No services yet.</p>';
  }
  $("#svc-tabs").addEventListener("click", function (e) {
    var t = e.target.closest(".tab"); if (!t) return;
    this.querySelectorAll(".tab").forEach(function (x) { x.classList.toggle("on", x === t); });
    filter = t.dataset.cat; renderServices();
  });
  $("#svc-list").addEventListener("input", function (e) { var c = e.target.closest(".svc"); if (c) c.classList.add("dirty"); });
  $("#svc-list").addEventListener("click", async function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var card = b.closest(".svc"), id = card.dataset.id, s = services.find(function (x) { return x.id === id; }), act = b.dataset.act;
    if (act === "save") {
      var patch = {}; card.querySelectorAll("[data-f]").forEach(function (el) { patch[el.dataset.f] = el.value.trim(); });
      if (!patch.title) return toast("Title is required", true);
      var r = await sb.from("services").update(patch).eq("id", id);
      if (r.error) return toast("Save failed: " + r.error.message, true);
      Object.assign(s, patch); card.classList.remove("dirty"); toast("Service saved");
      if (filter !== "all" && patch.category !== filter) renderServices();
    }
    if (act === "del") {
      if (!confirm("Delete “" + s.title + "”? This cannot be undone.")) return;
      var d = await sb.from("services").delete().eq("id", id);
      if (d.error) return toast("Delete failed: " + d.error.message, true);
      services = services.filter(function (x) { return x.id !== id; }); renderServices(); toast("Service deleted");
    }
    if (act === "up" || act === "down") {
      var list = visibleSvc(), i = list.indexOf(s), other = list[act === "up" ? i - 1 : i + 1];
      if (!other) return;
      var a = s.sort_order, c = other.sort_order; if (a === c) c = a + (act === "up" ? -1 : 1);
      var r1 = await sb.from("services").update({ sort_order: c }).eq("id", s.id);
      var r2 = await sb.from("services").update({ sort_order: a }).eq("id", other.id);
      if (r1.error || r2.error) return toast("Could not reorder", true);
      s.sort_order = c; other.sort_order = a;
      services.sort(function (x, y) { return x.sort_order - y.sort_order; }); renderServices();
    }
  });
  $("#svc-add").addEventListener("click", async function () {
    var max = services.reduce(function (m, x) { return Math.max(m, x.sort_order); }, 0);
    var r = await sb.from("services").insert({ category: filter === "social" ? "social" : "accounting", title: "New service", description: "", icon: "book", sort_order: max + 10 }).select().single();
    if (r.error) return toast("Could not add: " + r.error.message, true);
    services.push(r.data); renderServices();
    var last = $("#svc-list").lastElementChild; if (last) { last.scrollIntoView({ behavior: "smooth", block: "center" }); last.querySelector("input").select(); }
    toast("Service added: edit it, then Save");
  });
})();
</script>
</body>
</html>
